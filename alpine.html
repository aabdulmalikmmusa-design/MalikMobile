<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit Tracker (Alpine.js + Tailwind)</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for lightweight reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Mobile App Container Frame -->
    <div class="w-full max-w-md bg-white h-screen sm:h-[800px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-200">
        
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-6 shadow-md flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold">My Daily Habits</h1>
                <p class="text-indigo-200 text-sm">Consistency is key to growth.</p>
            </div>
            <a href="index.html" class="text-xs bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg font-medium transition" title="Switch to iPhone mockup view">
                UI Mockup 📱
            </a>
        </header>

        <!-- Main Content (Alpine.js Component) -->
        <main class="flex-1 overflow-y-auto p-6 space-y-4" x-data="habitApp()">
            
            <!-- Loading State -->
            <template x-if="loading">
                <div class="text-center py-10 text-gray-500">Loading habits...</div>
            </template>

            <!-- Empty State -->
            <template x-if="!loading && habits.length === 0">
                <div class="text-center py-12 text-gray-400">
                    <p class="text-lg">No habits found.</p>
                    <p class="text-sm">Add one below to get started!</p>
                </div>
            </template>

            <!-- Habit List -->
            <template x-for="habit in habits" :key="habit.id">
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 shadow-sm transition hover:shadow-md">
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" 
                               :checked="habit.is_completed_today" 
                               @change="toggleHabit(habit)"
                               class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer">
                        <div>
                            <p class="font-medium text-gray-800" :class="{ 'line-through text-gray-400': habit.is_completed_today }" x-text="habit.title"></p>
                            <span class="text-xs text-indigo-500 font-semibold" x-text="'🔥 Streak: ' + habit.streak_count + ' days'"></span>
                        </div>
                    </div>
                    <button @click="deleteHabit(habit.id)" class="text-gray-400 hover:text-red-500 text-lg font-bold px-2 py-1" title="Delete habit">&times;</button>
                </div>
            </template>

            <!-- Add Habit Form -->
            <form @submit.prevent="addHabit" class="mt-6 flex gap-2">
                <input type="text" 
                       x-model="newHabitTitle" 
                       placeholder="Enter a new habit..." 
                       required
                       class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <button type="submit" 
                        class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-medium hover:bg-indigo-700 transition text-sm">
                    Add
                </button>
            </form>
        </main>
    </div>

    <!-- JavaScript Logic to Connect to API -->
    <script>
        function habitApp() {
            return {
                habits: [],
                newHabitTitle: '',
                loading: true,

                init() {
                    this.fetchHabits();
                },

                fetchHabits() {
                    fetch('api/habits')
                        .then(response => response.json())
                        .then(data => {
                            this.habits = Array.isArray(data) ? data : (data.data || []);
                            this.loading = false;
                        })
                        .catch(err => {
                            console.error('Error fetching habits:', err);
                            this.loading = false;
                        });
                },

                addHabit() {
                    if (!this.newHabitTitle.trim()) return;

                    fetch('api/habits', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ title: this.newHabitTitle.trim() })
                    })
                    .then(response => response.json())
                    .then(result => {
                        const habit = result.habit || result;
                        this.habits.push(habit);
                        this.newHabitTitle = '';
                    })
                    .catch(err => console.error('Error adding habit:', err));
                },

                toggleHabit(habit) {
                    const updatedStatus = !habit.is_completed_today;
                    const updatedStreak = updatedStatus ? Number(habit.streak_count) + 1 : Math.max(0, Number(habit.streak_count) - 1);

                    fetch(`api/habits/${habit.id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            is_completed_today: updatedStatus,
                            streak_count: updatedStreak
                        })
                    })
                    .then(response => response.json())
                    .then(result => {
                        const updated = result.habit || result;
                        habit.is_completed_today = updated.is_completed_today;
                        habit.streak_count = updated.streak_count;
                    })
                    .catch(err => console.error('Error updating habit:', err));
                },

                deleteHabit(id) {
                    fetch(`api/habits/${id}`, {
                        method: 'DELETE',
                        headers: { 'Accept': 'application/json' }
                    })
                    .then(() => {
                        this.habits = this.habits.filter(h => h.id !== id);
                    })
                    .catch(err => console.error('Error deleting habit:', err));
                }
            }
        }
    </script>
</body>
</html>
